curr_chat_lang: "أهلاً بك. لغتك الحالية هي {}، اختر اللغة التي تريدها من الأزرار أدناه :)"
set_chat_lang: "رائع، لغتك الآن هي {}!"


pm_start_text: |
   مرحباً {}، أنا {}،
   أنا بوت لإدارة المجموعات بطابع الأنمي مع بعض الإضافات الممتعة ;)
   
   يمكنني القيام بمجموعة متنوعة من الأشياء، وأبرزها:
   - تقييد المستخدمين بصلاحيات *الحظر*.
   - الترحيب بالمستخدمين بالوسائط + النصوص والأزرار، مع تنسيق احترافي.
   - تقييد المستخدمين الذين يغرقون الدردشة باستخدام وحدة *مكافحة التكرار (Anti-flood)*.
   - *تحذير* المستخدمين وفقاً للخيارات المحددة وتقييدهم بناءً على ذلك.
   - حفظ الملاحظات والفلاتر مع التنسيقات والأزرار المناسبة.
   
   هناك المزيد! هذا مجرد غيض من فيض. يرجى ملاحظة أنني أحتاج
   إلى ترقيتي بصلاحيات مشرف كاملة لأعمل بشكل صحيح. 
   خلاف ذلك، لن أتمكن من أداء وظائفي كما يجب.
   
   *انقر على "المساعدة" لمعرفة المزيد!*
   
grp_start_text: "مرحباً، أنا Makima."

pm_help_text: |
   أهلاً بك! اسمي *Makima*. جزء من منظمة *Devils Hunter Union*.
   أنا بوت لإدارة المجموعات بنظام الوحدات مع بعض الإضافات الممتعة! ألقِ نظرة على ما يلي لتأخذ فكرة عن الأشياء التي يمكنني مساعدتك بها.
   الأوامر *الأساسية* المتاحة:
    • /start: لتشغيلي، يمكن استخدامه للتأكد من أنني متصل.
    • /help: يرسل لك هذه الرسالة في الخاص.
    • /language: لتغيير لغة البوت.
    • /settings:
      - في الخاص: سيرسل لك إعداداتك لجميع الوحدات المدعومة.
      - في المجموعة: سيوجهك إلى الخاص مع إعدادات تلك المجموعة.
    انقر على الأزرار أدناه للحصول على تعليمات حول وحدات محددة!

add_bot_to_group_btn: "إضافة Makima للمجموعة"
support_chat_link_btn: "الدعم"
updates_channel_link_btn: "التحديثات"
src_btn: "سورس الكود"

admin_help: |
   • `/admins`*:* عرض قائمة المشرفين في الدردشة.

   *للمشرفين فقط:*
   • `/pin`*:* لتثبيت الرسالة التي تم الرد عليها بصمت - أضف `'loud'` أو `'notify'` لإرسال تنبيه للمستخدمين.
   • `/unpin`*:* لإلغاء تثبيت الرسالة المثبتة حالياً.
   • `/invitelink`*:* للحصول على رابط الدعوة.
   • `/promote`*:* لترقية المستخدم الذي تم الرد عليه.
   • `/demote`*:* لتنزيل رتبة المستخدم الذي تم الرد عليه.
   • `/title <النص هنا>`*:* لتعيين لقب مخصص لمشرف قام البوت بترقيته.

afk_help: |
   - /afk <السبب>: تعيين حالتك كـ "بعيد عن لوحة المفاتيح".
   - brb <السبب>: نفس أمر afk ولكن ليس كأمر برمجي (كلمة عادية).
   عندما تكون في وضع AFK، أي إشارة (mention) لك سيتم الرد عليها برسالة تخبرهم أنك غير متاح!

anilist_help: |
    *AniList*
    احصل على معلومات حول الأنمي، المانجا، أو الشخصيات بمساعدة هذه الوحدة! يتم جلب جميع البيانات من [AniList](anilist.co).
    *الأوامر المتاحة:*
     - /anime <الاسم>: يعيد معلومات عن الأنمي.
     - /character <الاسم>: يعيد معلومات عن الشخصية.
     - /manga <الاسم>: يعيد معلومات عن المانجا.

antiflood_help: |
    تسمح لك "مكافحة التكرار" باتخاذ إجراء ضد المستخدمين الذين يرسلون أكثر من X من الرسائل المتتالية. تجاوز الحد سيؤدي لتقييد المستخدم.
     سيتم كتم المستخدمين إذا أرسلوا أكثر من 10 رسائل متتالية، ويتم تجاهل البوتات.
     • `/flood`*:* لعرض إعدادات التحكم في التكرار الحالية.
    • *للمشرفين فقط:*
     • `/setflood <رقم/'no'/'off'>`*:* لتمكين أو تعطيل التحكم في التكرار.
     *مثال:* `/setflood 10`
     • `/setfloodmode <ban/kick/mute/tban/tmute> <القيمة>`*:* الإجراء المتخذ عند تجاوز الحد.
    • *ملاحظة:*
     • يجب ملء القيمة لـ tban و tmute!!
     مثلاً:
     `5m` = 5 دقائق
     `6h` = 6 ساعات
     `3d` = 3 أيام
     `1w` = أسبوع واحد

approve_help: |
     أحياناً، قد تثق بمستخدم ما لعدم إرسال محتوى غير مرغوب فيه.
     ربما ليس بما يكفي لجعله مشرفاً، لكنك توافق على عدم تطبيق أقفال القناة، القوائم السوداء، ومكافحة التكرار عليه.
     هذا هو الغرض من "الموافقات" (Approvals).
     *أوامر المشرفين:*
     • `/approval`*:* للتحقق من حالة الموافقة للمستخدم في الدردشة الحالية.
     • `/approve`*:* للموافقة على مستخدم. لن تنطبق عليه الأقفال والقوائم السوداء ومكافحة التكرار.
     • `/unapprove`*:* لإلغاء الموافقة. سيعود لخضوع القواعد مرة أخرى.
     • `/approved`*:* عرض قائمة بجميع المستخدمين الموثقين.
     • `/unapproveall`*:* إلغاء الموافقة عن *الجميع*. لا يمكن التراجع عن هذا الفعل.

backup_help: |
    *للمشرفين فقط:*
     - /import: قم بالرد على ملف نسخة احتياطية (Group Butler) لاستيراد أكبر قدر ممكن من البيانات. ملاحظة: لا يمكن استيراد الصور/الملفات بسبب قيود تليجرام.
     - /export: تصدير بيانات المجموعة، والتي تشمل: القواعد، الملاحظات (المستندات، الصور، الموسيقى، الفيديو، الصوت، البصمات، النصوص، وأزرار النصوص).

bans_help: |
    - /kickme: يطرد المستخدم الذي أرسل الأمر من المجموعة.

     *للمشرفين فقط:*
    - /ban <المعرف>: حظر مستخدم (عبر المعرف أو الرد).
    - /tban <المعرف> x(m/h/d): حظر مؤقت للمستخدم. m=دقائق، h=ساعات، d=أيام.
    - /unban <المعرف>: إلغاء حظر مستخدم.
    - /kick <المعرف>: طرد مستخدم من المجموعة.

blacklist_help: |
    تستخدم القوائم السوداء لمنع كلمات معينة من أن تقال في المجموعة. في كل مرة يتم ذكر الكلمة، سيتم حذف الرسالة فوراً.
    *ملاحظة*: القوائم السوداء لا تؤثر على المشرفين.

     • `/blacklist`*:* عرض الكلمات المحظورة حالياً.

    *للمشرفين فقط:*
     • `/addblacklist <الكلمات>`*:* إضافة كلمة للقائمة السوداء. كل سطر يعتبر كلمة واحدة.
     • `/unblacklist <الكلمات>`*:* إزالة كلمات من القائمة السوداء.
     • `/blacklistmode <off/del/warn/ban/kick/mute/tban/tmute>`*:* الإجراء المتخذ عند إرسال كلمات محظورة.

cleaner_help: |
    - /cleanbluetext <on/off/yes/no> - تنظيف الأوامر (النصوص الزرقاء) بعد إرسالها.
    - /ignorecleanbluetext <كلمة> - منع التنظيف التلقائي لأمر معين.
    - /unignorecleanbluetext <كلمة> - إزالة المنع.
    - /listcleanbluetext - عرض قائمة الأوامر المستثناة من التنظيف.

connections_help: |
    - /connect: ربط دردشة (يمكن في مجموعة أو عبر الخاص باستخدام ID المجموعة).
    - /connection: عرض الدردشات المرتبطة.
    - /disconnect: قطع الاتصال بدردشة.
    - /helpconnect: عرض الأوامر المتاحة التي يمكن القيام بها عن بُعد.

     *للمشرفين فقط:*
    - /allowconnect <yes/no>: السماح للمستخدم بالاتصال بدردشة.

cust_filters_help: |
    • `/filters`*:* عرض جميع الفلاتر النشطة في الدردشة.

     *للمشرفين فقط:*
    • `/filter <الكلمة> <رسالة الرد>`*:* إضافة فلتر. سيرد البوت بهذه الرسالة كلما ذكرت "الكلمة". إذا رددت على ملصق بكلمة، سيرد البوت بذلك الملصق. ملاحظة: الفلاتر ليست حساسة لحالة الأحرف. إذا كانت الكلمة جملة، استخدم علامات التنصيص.
    • `/stop <كلمة الفلتر>`*:* إيقاف هذا الفلتر.

     *لمنشئ الدردشة فقط:*
    • `/removeallfilters`*:* إزالة جميع الفلاتر دفعة واحدة.

      *ملاحظة*: تدعم الفلاتر تنسيقات مثل: {first} و {last} وغيرها، بالإضافة للأزرار. راجع `/markdownhelp`.

disable_help: |
    لا يريد الجميع كل الميزات التي يقدمها البوت. بعض الأوامر يفضل تعطيلها لتجنب السبام.
    هذا يسمح لك بتعطيل الأوامر الشائعة.

     • /cmds: التحقق من حالة الأوامر المعطلة.

     *للمشرفين فقط:*
     • /enable <اسم الأمر>: تمكين الأمر.
     • /disable <اسم الأمر>: تعطيل الأمر.
     • /listcmds: عرض جميع الأوامر التي يمكن تعطيلها.

feds_help: |
    كل شيء ممتع، حتى يبدأ المخربون بالدخول لمجموعتك. مع نظام "الاتحاد" (Federation)، يمكنك جعل الحظر في دردشة واحدة يشمل جميع الدردشات الأخرى في الاتحاد.
    يمكنك تعيين مشرفين للاتحاد لحماية مجموعاتك.

    *انقر على الأزرار أدناه لمعرفة المزيد عن الأوامر.*

FED_OWNER_HELP: | 
    *لمالك الاتحاد فقط:*
    • `/newfed <اسم_الاتحاد>`*:* إنشاء اتحاد جديد (واحد لكل مستخدم).
    • `/renamefed <id_الاتحاد> <الاسم_الجديد>`*:* تغيير اسم الاتحاد.
    • `/delfed <id_الاتحاد>`*:* حذف الاتحاد بالكامل.
    • `/fpromote <المستخدم>`*:* تعيين مستخدم كمشرف في الاتحاد.
    • `/fdemote <المستخدم>`*:* تنزيل رتبة مشرف الاتحاد.
    • `/subfed <id_الاتحاد>`*:* الاشتراك في اتحاد آخر (الحظر هناك سيطبق عندك).
    • `/unsubfed <id_الاتحاد>`*:* إلغاء الاشتراك.
    • `/setfedlog <id_الاتحاد>`*:* تعيين مجموعة كقاعدة لسجلات الاتحاد.
    • `/fbroadcast <الرسالة>`*:* إذاعة رسالة لجميع المجموعات في اتحادك.

FED_ADMIN_HELP: |
    *لمشرفي الاتحاد:*
    • `/fban <المستخدم> <السبب>`*:* حظر مستخدم من الاتحاد.
    • `/unfban <المستخدم> <السبب>`*:* إلغاء حظر مستخدم من الاتحاد.
    • `/fedinfo <id_الاتحاد>`*:* معلومات عن الاتحاد.
    • `/joinfed <id_الاتحاد>`*:* ربط الدردشة الحالية بالاتحاد (للمالك فقط).
    • `/leavefed <id_الاتحاد>`*:* مغادرة الاتحاد.
    • `/fedadmins`*:* عرض مشرفي الاتحاد.
    • `/fbanlist`*:* عرض قائمة المحظورين في الاتحاد.

FED_USER_HELP: | 
    *لأي مستخدم:*
    • `/fbanstat`*:* التحقق مما إذا كنت أنت أو المستخدم الذي ترد عليه محظوراً في أي اتحاد.
    • `/frules`*:* عرض قوانين الاتحاد.

formt_help_bse: |
    يدعم Makima عدداً كبيراً من خيارات التنسيق لجعل رسائلك أكثر تعبيراً. ألقِ نظرة!

md_help: |
    <b>تنسيقات Markdown</b>
      يمكنك تنسيق رسالتك باستخدام *العريض*، _المائل_، -التحته خط-، وأكثر من ذلك بكثير!
      <b>التنسيقات المدعومة:</b>
      - <code>`نص`</code>: للخط أحادي المسافة (كود).
      - <code>_نص_</code>: للخط المائل.
      - <code>*نص*</code>: للخط العريض.
      - <code>~نص~</code>: للخط المشطوب.
      - <code>[نص](link)</code>: لإنشاء رابط تشعبي.
      - <code>[اسمي](buttonurl://example.com)</code>: لإنشاء أزرار.
      إذا أردت وضع أزرار في نفس السطر، استخدم <code>:same</code> في نهاية الرابط.
      مثال:
      <code>[زر 1](buttonurl://link1)</code>
      <code>[زر 2](buttonurl://link2:same)</code>

filling_help: |
      <b>التعبئة التلقائية (Fillings)</b>
      يمكنك تخصيص محتوى رسالتك ببيانات متغيرة. مثلاً، ذكر اسم المستخدم في رسالة الترحيب!
      <b>المتغيرات المدعومة:</b>
      - <code>{first}</code>: الاسم الأول للمستخدم.
      - <code>{last}</code>: الاسم الأخير.
      - <code>{fullname}</code>: الاسم الكامل.
      - <code>{username}</code>: المعرف (username)، أو إشارة للمستخدم إن لم يملك واحداً.
      - <code>{mention}</code>: إشارة للمستخدم باسمه الأول.
      - <code>{id}</code>: آيدي المستخدم.
      - <code>{chatname}</code>: اسم الدردشة.

fun_help: |
     • /runs: رد عشوائي مرح.
     • /pat: "طبطبة" على شخص ما :3
     • /slap: "صفع" مستخدم.
     • /shrug : تعبير الشك (shrug) ¯\_(ツ)_/¯.
     • /table : قلب الطاولة.
     • /decide : إجابة عشوائية (نعم/لا/ربما).
     • /toss : رمي عملة معدنية.
     • /roll : رمي نرد.
     • /shout <كلمة>: كتابة الكلمة بشكل ضخم ومتباعد.
     • /stickerid: الرد على ملصق للحصول على الـ ID الخاص به.
     • /getsticker: الرد على ملصق للحصول عليه كصورة PNG.
     • /steal: الرد على ملصق أو صورة لإضافتها لحزمتك الخاصة.

antispam_help: |
     *للمشرفين فقط:*
      • `/antispam <on/off>`*:* لتفعيل أو تعطيل تقنية مكافحة السبام العالمية.

     يستخدم مطورو البوت نظام Anti-Spam لحظر المزعجين عبر جميع المجموعات.
     يدمج Makima أيضاً API الخاص بـ @Spamwatch لإزالة المزعجين تلقائياً.

gtranslate_help: |
     استخدم هذه الوحدة للترجمة!
     *الأوامر:*
     • `/tl` (أو `/tr`): بالرد على رسالة، يترجمها للإنجليزية.
     • `/tl <اللغة>`: يترجم إلى اللغة المحددة (مثلاً: `/tl ar` للترجمة للعربية).
     • `/langs`: عرض قائمة اللغات المدعومة.

locks_help: |
     هل تزعجك الملصقات؟ أو الروابط؟ أو الصور؟
     تسمح لك وحدة الأقفال بقفل أنواع معينة من الرسائل؛ وسيقوم البوت بحذفها تلقائياً!
      • `/locktypes`*:* عرض كل أنواع الأشياء التي يمكن قفلها.

     *للمشرفين فقط:*
      • `/lock <النوع>`*:* قفل نوع معين.
      • `/unlock <النوع>`*:* إلغاء قفل نوع معين.
      • `/locks`*:* عرض قائمة الأقفال الحالية في الدردشة.
     قفل الـ bots سيمنع غير المشرفين من إضافة بوتات للمجموعة.

log_help: |
      *للمشرفين فقط:*
      • `/logchannel`*:* معلومات قناة السجل.
      • `/setlog`*:* تعيين قناة السجل.
      • `/unsetlog`*:* إلغاء تعيين قناة السجل.
      • `/announce`*:* تبديل إعلان إجراءات المشرفين في الدردشة.

markdown_help_text: |
      الماركداون أداة قوية للتنسيق.
      - <code>_مائل_</code>: نص مائل.
      - <code>*عريض*</code>: نص عريض.
      - <code>`كود`</code>: نص بآلة كاتبة.
      - <code>[نص](رابط)</code>: رابط تشعبي.
      - <code>[نص الزر](buttonurl:رابط)</code>: لإنشاء زر تليجرام.

misc_help: |
      • /id: الحصول على آيدي المجموعة أو المستخدم.
      • /info: معلومات عن المستخدم.
      • /ud <كلمة>: البحث في قاموس Urban Dictionary.
      • /paste: رفع نص إلى `nekobin.com`.
      • /cash: محول عملات (مثال: `/cash 1 USD EGP`).
      • /antichannel <on/off>: منع الدردشة بأسماء القنوات وإجبار المستخدمين على التحدث بحساباتهم الشخصية.

muting_help: |
      *للمشرفين فقط:*
       • `/mute <المعرف>`*:* كتم مستخدم.
       • `/tmute <المعرف> x(m/h/d)`*:* كتم مؤقت.
       • `/unmute <المعرف>`*:* إلغاء الكتم.

notes_help: |
       • `/get <اسم_الملاحظة>`*:* جلب الملاحظة.
       • `#<اسم_الملاحظة>`*:* اختصار لجلب الملاحظة.
       • `/notes` أو `/saved`*:* عرض جميع الملاحظات المحفوظة.
       *للمشرفين فقط:*
       • `/save <اسم_الملاحظة> <المحتوى>`*:* حفظ ملاحظة جديدة.
       • `/clear <اسم_الملاحظة>`*:* حذف ملاحظة.

purge_help: |
       *للمشرفين فقط:*
        • /del: حذف الرسالة التي رددت عليها.
        • /purge: حذف جميع الرسائل من الرسالة التي رددت عليها حتى الآن.

reports_help: |
        • `/report <السبب>`*:* بالرد على رسالة لإبلاغ المشرفين.
        • `@admin`*:* نفس عمل الأمر السابق.
        *للمشرفين فقط:*
        • `/reports <on/off>`*:* تفعيل أو تعطيل نظام البلاغات.

rules_help: |
      • `/rules`*:* عرض قوانين المجموعة.
       *للمشرفين فقط:*
      • `/setrules <القوانين هنا>`*:* تعيين قوانين المجموعة.
      • `/clearrules`*:* حذف القوانين.

warns_help: |
      • `/warns <المعرف>`*:* عرض عدد تحذيرات المستخدم.
      *للمشرفين فقط:*
      • `/warn <المعرف>`*:* تحذير مستخدم. (بعد 3 تحذيرات يتم الحظر تلقائياً).
      • `/resetwarn <المعرف>`*:* تصفير تحذيرات المستخدم.
      • `/warnlimit <العدد>`*:* تعيين حد التحذيرات.

greetings_help: |
      *للمشرفين فقط:*
       • `/welcome <on/off>`*:* تفعيل/تعطيل رسائل الترحيب.
       • `/goodbye <on/off>`*:* تفعيل/تعطيل رسائل المودع.
       • `/setwelcome <النص>`*:* تعيين رسالة ترحيب مخصصة.
       • `/setgoodbye <النص>`*:* تعيين رسالة وداع مخصصة.
       • `/cleanservice <on/off`*:* حذف رسائل التليجرام التلقائية (دخل فلان/خرج فلان).

raid_help: |
  هل تعرضت مجموعتك لهجوم من البوتات؟
  تسمح لك هذه الوحدة بإيقاف المهاجمين بسرعة.
  بتفعيل *وضع الغارة (Raid Mode)*، سأقوم تلقائياً بطرد أي مستخدم يحاول الانضمام.
  
   *للمشرفين فقط!* • /raid `(off/الوقت اختياري)` : تفعيل أو تعطيل وضع الغارة.
  إذا لم يتم تحديد وقت، سيكون الافتراضي ساعتين.
  
  • /raidtime : عرض أو تعيين المدة الافتراضية لوضع الغارة.